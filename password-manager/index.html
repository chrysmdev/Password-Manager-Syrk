<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager</title>
  <link rel="stylesheet" href="styles.css">
  
</head>
<body>
  <!-- Sidebar -->
  <aside class="sidebar">
    <h1>Project P4SS</h1>

    <button class="button-add-account" role="button"><span class="text">ADD ACCOUNT</span></button>

    <a href="http://127.0.0.1:3000/password-manager/index.html" class="home"><h3>Home</h3></a>

    <h3>Categories</h3>
    <ul class="category-list">
      <li></li>
    </ul>

    <div class="user">
      USER HERE
    </div>
  </aside>

  <!-- Search Bar -->
  <div class="search-container">
    <input type="text" name="search" placeholder="Search for an account..." class="search-input">
    <button href="#" class="search-btn">
      <img src="images/lupa.png" class="search-btn-img">
    </button>
  </div>
  
  <!-- All Passwords Table -->
  
  <div class="container">
    <div class="table-container">
      <table>
        <thead>
          <tr>
            <th>Website</th>
            <th>LOGIN</th>
            <th>Password</th>
            <th>Notes</th>
          </tr>
        </thead>
        <tbody id="table-body">
          <!-- Conteúdo será gerado dinamicamente -->
        </tbody>
      </table>
    </div>

  <!-- Scripts -->
  <script src="script.js" type="module"></script>

</body>
</html>
